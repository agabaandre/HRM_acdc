# Production-ish override: bake image, no source bind-mount, restart policies.
#
#   docker compose --env-file docker/.env \
#     -f docker-compose.yml -f docker-compose.prod.yml \
#     --profile workers up -d --build
#
# Requires module .env files present in the build context (or inject secrets
# via your orchestrator). Do not use profile bundled-db in production.
# web + workers share cbp-staff-runtime:prod (one build).

x-cbp-runtime-prod: &cbp-runtime-prod
  image: cbp-staff-runtime:prod
  build:
    target: prod

services:
  web:
    <<: *cbp-runtime-prod
    volumes: []
    restart: unless-stopped

  redis:
    restart: unless-stopped

  workers:
    <<: *cbp-runtime-prod
    volumes: []
    restart: unless-stopped
    # Bake still ships docker/supervisord-workers.conf under /var/www/staff
    command:
      [
        "supervisord",
        "-n",
        "-c",
        "/var/www/staff/docker/supervisord-workers.conf",
      ]
