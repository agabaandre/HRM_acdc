; CBP Docker workers — all Laravel modules (queue + scheduler).
; Used by compose profile `workers`:
;   supervisord -n -c /var/www/staff/docker/supervisord-workers.conf

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ---- staff-portal ----
[program:cbp-docker-staff-portal-queue]
process_name=%(program_name)s_%(process_num)02d
command=php artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/staff/modules/staff-portal/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/staff/modules/staff-portal/backend/storage/logs/supervisor-queue.log
stopwaitsecs=3600

[program:cbp-docker-staff-portal-scheduler]
command=php artisan schedule:work
directory=/var/www/staff/modules/staff-portal/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/staff/modules/staff-portal/backend/storage/logs/supervisor-scheduler.log
stopwaitsecs=60

