    <style>
      #helpdesk-boot-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(248, 249, 250, 0.96);
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #helpdesk-boot-loader.hd-boot-loader--out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #helpdesk-boot-loader .hd-boot-loader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        text-align: center;
      }
      #helpdesk-boot-loader .hd-boot-loader__spinner {
        position: relative;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 50%;
        border: 3px solid rgba(13, 122, 58, 0.14);
        border-top-color: #0d7a3a;
        animation: hd-preloader-spin 0.75s linear infinite;
      }
      body.hd-app-loading {
        overflow: hidden;
      }
      #helpdesk-boot-loader .hd-boot-loader__label {
        margin: 0;
        font-family: Arial, Roboto, sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #0d7a3a;
      }
      @media (prefers-color-scheme: dark) {
        #helpdesk-boot-loader {
          background: rgba(15, 23, 42, 0.96);
        }
        #helpdesk-boot-loader .hd-boot-loader__spinner {
          border-color: rgba(74, 222, 128, 0.18);
          border-top-color: #4ade80;
        }
        #helpdesk-boot-loader .hd-boot-loader__label {
          color: #4ade80;
        }
      }
      @keyframes hd-preloader-spin {
