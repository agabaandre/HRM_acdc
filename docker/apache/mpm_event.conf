# Event MPM — sized for ~8 CPU / 32 GB CBP Docker host
<IfModule mpm_event_module>
    ServerLimit             12
    StartServers            4
    MinSpareThreads         50
    MaxSpareThreads         150
    ThreadLimit             64
    ThreadsPerChild         25
    MaxRequestWorkers       250
    MaxConnectionsPerChild  10000
</IfModule>

KeepAlive On
MaxKeepAliveRequests 500
KeepAliveTimeout 5
