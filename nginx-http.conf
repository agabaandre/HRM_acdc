# Deploy to: /etc/nginx/conf.d/cphia-http.conf
# OPTIONAL — only if you split map/zones out of cphia-frontend.conf.
# If map is already at the top of cphia-frontend.conf, do NOT install this file
# (duplicate zone definitions will fail nginx -t).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=cphia_general:10m rate=10r/s;
limit_req_zone  $binary_remote_addr zone=cphia_login:10m  rate=5r/m;
limit_conn_zone $binary_remote_addr zone=cphia_conn:10m;
