# Deploy as: /etc/nginx/sites-enabled/cphia-laravel.conf
# IMPORTANT: use "listen 443 ssl" only — do NOT add http2 (causes port 443 warnings).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ceu.africacdc.org;

    server_tokens off;

    root /var/www/cphia-laravel/public;
    index index.php;

    client_max_body_size 50M;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ceu.africacdc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ceu.africacdc.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* \.(env|git|bak|sql|old|swp|ini|log|conf|cfg|yml|yaml|pem|key|crt)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.ht {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ceu.africacdc.org;

    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
