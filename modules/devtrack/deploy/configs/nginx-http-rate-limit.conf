# HTTP-context rate-limit zones for host Nginx (must live in conf.d / http{}).
# Fixes: [emerg] zero size shared memory zone "api_limit"
#
# Install:
#   sudo cp deploy/configs/nginx-http-rate-limit.conf /etc/nginx/conf.d/email-server-rate-limit.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Other sites on this host may already use zone=api_limit; this defines it once.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=email_server_api:10m rate=30r/s;
