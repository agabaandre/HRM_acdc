openapi: 3.0.3
info:
  title: Africa CDC Staff Share API
  description: |
    CI3-compatible Share endpoints for APM (and other CBP consumers).

    **Payload shapes match** `/staff/share/*` from CodeIgniter.

    ### Authentication
    1. **Preferred — login** — `POST /share/login` with JSON `username` + `password`
       (portal `work_email` + password), then `Authorization: Bearer {access_token}`
       (same pattern as KnowledgeHub UserLogin).
    2. **Legacy — Basic token** — `POST /share/token` with HTTP Basic Auth → JWT
       (kept for existing clients).
    3. **HTTP Basic on each request** — portal `work_email` + password on protected routes.
    4. **Static API token** — `Authorization: Bearer {STAFF_API_TOKEN}` or path `/{STAFF_API_TOKEN}`
    5. **Staff SSO JWT** — valid `JWT_SECRET` Bearer token with `staff_id`.
  version: 2.1.0
  contact:
    name: Africa CDC CBP

servers:
  - url: /staff/backend
    description: Production / Host Apache (cbp.africacdc.org)
  - url: /staff/staff-portal/backend
    description: Local staff-portal Laravel
  - url: /staff
    description: Legacy CI host (when rewritten / proxied)

tags:
  - name: Auth
  - name: Reference
  - name: Docs

paths:
  /share/login:
    post:
      tags: [Auth]
      summary: Login (username + password → JWT)
      description: |
        Exchange portal login credentials for a Bearer JWT (`aud=share-api`).

        Same idea as KnowledgeHub **UserLogin**: send `username` and `password` in the
        JSON body (no HTTP Basic header required). Use `access_token` or `token` on
        subsequent requests as `Authorization: Bearer …`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: user@africacdc.org
              password: '********'
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'
        '422':
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /share/token:
    post:
      tags: [Auth]
      summary: Issue Share API JWT (HTTP Basic — legacy)
      description: |
        **Backward-compatible alternative** to `POST /share/login`.

        Exchange HTTP Basic credentials (`work_email` + password) for a Bearer JWT
        (`aud=share-api`). Prefer `/share/login` for new integrations.
      security:
        - basicAuth: []
      responses:
        '200':
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid or missing Basic Auth
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthError'

  /share/get_current_staff:
    get:
      tags: [Reference]
      summary: Current staff (APM staff:sync)
      description: |
        Returns a **JSON array** of staff rows with latest contract fields
        (same shape as CI `Share::get_current_staff`). Includes `associated_divisions`.
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Start'
        - name: staff_id
          in: query
          schema:
            type: integer
        - name: division_id
          in: query
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
      responses:
        '200':
          description: Array of staff records (not wrapped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffRow'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/get_current_staff/{token}:
    get:
      tags: [Reference]
      summary: Current staff (legacy path token)
      description: Same as `/share/get_current_staff` with `{token}` = `STAFF_API_TOKEN` (APM URL style).
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Start'
      responses:
        '200':
          description: Array of staff records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffRow'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/divisions:
    get:
      tags: [Reference]
      summary: Divisions (APM divisions:sync)
      description: Raw `divisions` table rows as a JSON array (CI parity).
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      responses:
        '200':
          description: Array of division rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/divisions/{token}:
    get:
      tags: [Reference]
      summary: Divisions (legacy path token)
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
      responses:
        '200':
          description: Array of division rows
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/directorates:
    get:
      tags: [Reference]
      summary: Directorates (APM directorates:sync)
      description: |
        Directorate rows plus optional nested `director` object
        (`id`, `fname`, `lname`, `title`, `name`) — CI parity.
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      responses:
        '200':
          description: Array of directorate rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectorateRow'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/directorates/{token}:
    get:
      tags: [Reference]
      summary: Directorates (legacy path token)
      security:
        - basicAuth: []
        - bearerAuth: []
        - apiToken: []
      parameters:
        - $ref: '#/components/parameters/PathToken'
      responses:
        '200':
          description: Array of directorate rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DirectorateRow'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /share/openapi.yaml:
    get:
      tags: [Docs]
      summary: OpenAPI 3 specification
      security: []
      responses:
        '200':
          description: YAML OpenAPI document
          content:
            application/yaml:
              schema:
                type: string

  /share/docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      security: []
      responses:
        '200':
          description: HTML Swagger UI
          content:
            text/html:
              schema:
                type: string

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Portal user work_email + password (legacy token + protected routes)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from POST /share/login (preferred) or POST /share/token, or Staff SSO JWT
    apiToken:
      type: http
      scheme: bearer
      description: Static STAFF_API_TOKEN value

  parameters:
    PathToken:
      name: token
      in: path
      required: true
      schema:
        type: string
      description: STAFF_API_TOKEN (legacy APM path segment)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
      description: Max rows
    Start:
      name: start
      in: query
      schema:
        type: integer
      description: Offset

  responses:
    Unauthorized:
      description: Authentication failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'

  schemas:
    AuthError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Authentication Failed! Invalid Request

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: Portal staff work_email (or user.email when present)
          example: user@africacdc.org
        email:
          type: string
          description: Alias for username
          example: user@africacdc.org
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        access_token:
          type: string
          description: JWT — use as Authorization Bearer
        token:
          type: string
          description: Same value as access_token (KnowledgeHub-style alias)
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          example: 3600
        aud:
          type: string
          example: share-api
        user:
          type: object
          properties:
            user_id:
              type: integer
            staff_id:
              type: integer
            name:
              type: string
            email:
              type: string
            role:
              type: integer

    StaffRow:
      type: object
      additionalProperties: true
      properties:
        staff_id:
          type: integer
        fname:
          type: string
        lname:
          type: string
        work_email:
          type: string
        division_id:
          type: integer
          nullable: true
        division_name:
          type: string
          nullable: true
        associated_divisions:
          type: array
          items:
            type: integer
        other_associated_divisions:
          nullable: true

    DirectorateRow:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: integer
        director_id:
          type: integer
          nullable: true
        director:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            fname:
              type: string
            lname:
              type: string
            title:
              type: string
              nullable: true
            name:
              type: string
