# CBP (staff-portal, APM, finance, helpdesk, risk-register) — Apache/PHP + Redis.
#
#   cp docker/compose.env.example docker/.env
#   docker compose --env-file docker/.env up -d --build
#
# Optional workers (Supervisor: queue + scheduler for all five Laravel apps):
#   docker compose --env-file docker/.env --profile workers up -d --build
#
# Optional bundled MySQL (set DB_HOST=mysql in each module .env):
#   docker compose --env-file docker/.env --profile bundled-db up -d --build
#
# Open: http://localhost:8080/staff/

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        # 0 = fast (default). Set INSTALL_PDF_TOOLS=1 in docker/.env for LibreOffice/GS.
        INSTALL_PDF_TOOLS: ${INSTALL_PDF_TOOLS:-0}
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www/staff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Compose overrides so repo .env stays host-native (127.0.0.1) for Apache :80.
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_URL: ${STAFF_PORTAL_APP_URL:-http://localhost:8088/staff/backend}
      STAFF_PORTAL_BASE_URL: ${STAFF_PORTAL_BASE_URL:-http://localhost:8088/staff/backend/}
      STAFF_PORTAL_SPA_URL: ${STAFF_PORTAL_SPA_URL:-http://localhost:8088/staff/}
      BASE_URL: ${STAFF_BASE_URL:-http://localhost:8088/staff/}
      APM_BASE_URL: ${APM_BASE_URL:-http://localhost:8088/staff/apm}
      STAFF_API_INTERNAL_BASE_URL: http://web/staff/backend
    depends_on:
      redis:
        condition: service_healthy

  workers:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
      args:
        INSTALL_PDF_TOOLS: ${INSTALL_PDF_TOOLS:-0}
    volumes:
      - .:/var/www/staff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: host.docker.internal
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STAFF_API_INTERNAL_BASE_URL: http://web/staff/backend
      SKIP_REDIS_WAIT: "0"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command:
      [
        "supervisord",
        "-n",
        "-c",
        "/var/www/staff/docker/supervisord-workers.conf",
      ]

  mysql:
    profiles: ["bundled-db"]
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PUBLISH_PORT:-33060}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-staff}
      MYSQL_USER: ${MYSQL_USER:-staff}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-staff}
      STAFF_DB_NAME: ${STAFF_DB_NAME:-staff}
      APM_DB_NAME: ${APM_DB_NAME:-apm_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 35s

volumes:
  redis_data:
  mysql_data:
