# CBP (staff-portal, APM, finance, helpdesk) — Apache/PHP + Redis.
#
#   cp docker/compose.env.example docker/.env
#   docker compose --env-file docker/.env up -d --build
#
# Optional workers:
#   docker compose --env-file docker/.env --profile workers up -d --build
#
# Optional bundled MySQL (set DB_HOST=mysql in each module .env):
#   docker compose --env-file docker/.env --profile bundled-db up -d --build
#
# Open: http://localhost:8080/staff/

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    ports:
      - "${APP_PORT:-8088}:80"
    volumes:
      - .:/var/www/staff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy

  queue-apm:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    volumes:
      - .:/var/www/staff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command:
      [
        "php",
        "/var/www/staff/modules/apm/artisan",
        "queue:work",
        "--sleep=1",
        "--tries=3",
        "--timeout=90",
      ]

  queue-helpdesk:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    volumes:
      - .:/var/www/staff
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    command:
      [
        "php",
        "/var/www/staff/modules/helpdesk/backend/artisan",
        "queue:work",
        "--sleep=1",
        "--tries=3",
        "--timeout=90",
      ]

  mysql:
    profiles: ["bundled-db"]
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PUBLISH_PORT:-33060}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-staff}
      MYSQL_USER: ${MYSQL_USER:-staff}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-staff}
      STAFF_DB_NAME: ${STAFF_DB_NAME:-staff}
      APM_DB_NAME: ${APM_DB_NAME:-apm_local}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 35s

volumes:
  redis_data:
  mysql_data:
