# Shared security headers for Email Server (host Nginx + Docker Nginx)
# Include from a server { } block:
#   include /etc/nginx/snippets/email-server-security-headers.conf;
#
# CSP is intentionally NOT set here. Multiple Content-Security-Policy headers
# are intersected by browsers; a second policy without the SPA nonce would
# break Vuetify. CSP is applied by:
#   - docker/nginx/frontend.conf (admin SPA, per-request nonce)
#   - Laravel App\Http\Middleware\SecurityHeaders (API)

# Hide Nginx version in error pages / Server header
server_tokens off;

# Do not advertise the upstream app stack
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header X-AspNetMvc-Version;
fastcgi_hide_header X-Powered-By;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
